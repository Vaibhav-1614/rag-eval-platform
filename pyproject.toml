[project]
name = "rag-eval-platform"
version = "1.0.0"
description = "RAG evaluation platform and production query service over SEC 10-K filings"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
src = [".", "src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
