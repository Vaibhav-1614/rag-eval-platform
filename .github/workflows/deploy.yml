name: Deploy to Hugging Face Spaces

# Free hosting: HF Docker Space (2 vCPU / 16 GB, no card; sleeps after 48 h idle).
# Runs after a merge to main (and by hand). Needs repo secret HF_TOKEN (write) and
# repo variable HF_SPACE, e.g. Vaibhav-1614/rag-10k-api. LLM/Langfuse secrets are
# optional and are copied into the Space's secrets.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-hf
  cancel-in-progress: false

jobs:
  gate:
    uses: ./.github/workflows/pr.yml

  deploy:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ vars.HF_SPACE }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_HOST: ${{ vars.LANGFUSE_HOST }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      API_KEYS: ${{ secrets.API_KEYS }}
    steps:
      - name: Check deploy config
        id: cfg
        run: |
          if [ -n "$HF_TOKEN" ] && [ -n "$HF_SPACE" ]; then echo "ok=true" >> "$GITHUB_OUTPUT";
          else echo "ok=false" >> "$GITHUB_OUTPUT"; echo "HF_TOKEN secret or HF_SPACE variable missing: not deploying." >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ok == 'true'
      - uses: actions/setup-python@v5
        if: steps.cfg.outputs.ok == 'true'
        with:
          python-version: "3.11"
      - if: steps.cfg.outputs.ok == 'true'
        run: pip install "huggingface_hub>=0.25" httpx
      - name: Upload to Space
        if: steps.cfg.outputs.ok == 'true'
        run: python deploy/hf_deploy.py | tee deploy.log
      - name: Smoke test the live Space
        if: steps.cfg.outputs.ok == 'true'
        run: |
          URL=$(grep '^api:' deploy.log | awk '{print $2}')
          echo "Live API: $URL/docs" >> "$GITHUB_STEP_SUMMARY"
          python deploy/smoke_test.py "$URL" 1200
