# Runner-up kept as a switchable alternative (RETRIEVAL_CONFIG=configs/retrieval/v1-hybrid.yaml).
# Needs torch + sentence-transformers (Docker build arg WITH_DENSE=1).
version: v1-hybrid
strategy: hybrid            # dense top-20 + BM25 top-20 merged with RRF (k=60)
chunk_size: 256
embedding_model: bge        # BAAI/bge-small-en-v1.5
top_k: 5
corpus:
  description: "latest 10-K per company (fiscal 2025 for most; NVIDIA fiscal 2026)"
  tickers: [AAPL, MSFT, GOOGL, AMZN, META, NVDA, TSLA, JPM, JNJ, XOM]
benchmark:
  hit_at_5: 0.90
  mrr: 0.751
  ndcg_at_5: 0.781
  avg_latency_ms: 29.9
